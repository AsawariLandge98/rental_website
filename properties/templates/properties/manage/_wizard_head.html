<div class="wizard-exit">
    <a href="{% url 'properties:my_listings' %}" class="link-more">Save &amp; Exit</a>
</div>
<div class="wizard-head">
    <div class="step-indicator">
        {% for n, label in wizard_nav %}
        <div class="step-indicator__step {% if n == step_number %}is-active{% elif n < step_number %}is-done{% endif %}">
            <span class="step-indicator__circle">
                {% if n < step_number %}{% include "partials/icon.html" with name="check" cls="icon-sm" %}{% else %}{{ n }}{% endif %}
            </span>
            <span class="step-indicator__label">{{ label }}</span>
        </div>
        {% if not forloop.last %}<span class="step-indicator__line"></span>{% endif %}
        {% endfor %}
    </div>
</div>
